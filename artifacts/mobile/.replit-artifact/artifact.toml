kind = "mobile"
previewPath = "/mobile/"
title = "Finanshels Mobile"
description = "A mobile companion app for Finanshels that lets finance managers and team leads check project status and manage tasks on the go. Includes a Projects list with status chips and due dates, a Tasks screen with status filters, and a Profile tab, styled with the Finanshels brand (orange #F16611, Poppins)."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
