openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pms-assistant
    description: Read-only, evidence-grounded PMS assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pms-assistant/status:
    get:
      operationId: getPmsAssistantStatus
      tags: [pms-assistant]
      summary: Check PMS assistant availability
      description: Reports readiness for the authenticated server identity, trusted PMS adapter, and OpenAI proxy.
      responses:
        "200":
          description: Assistant availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PmsAssistantStatus"
  /pms-assistant/answers:
    post:
      operationId: createPmsAssistantAnswer
      tags: [pms-assistant]
      summary: Ask an evidence-grounded PMS question
      description: Answers using only records the authenticated server identity can access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PmsAssistantQuestionInput"
      responses:
        "200":
          description: Answer or explicit unavailable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PmsAssistantAnswer"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PmsAssistantQuestionInput:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - question
    PmsAssistantStatus:
      type: object
      additionalProperties: false
      properties:
        ready:
          type: boolean
        reason:
          type: string
        personalization:
          $ref: "#/components/schemas/PmsAssistantPersonalization"
      required: [ready, reason]
    PmsAssistantPersonalization:
      type: object
      additionalProperties: false
      description: Server-derived browser preference namespace, never an authorization credential.
      properties:
        key:
          type: string
          pattern: "^[a-f0-9]{64}$"
        timeZone:
          type: string
      required: [key, timeZone]
    PmsAssistantQueryIntent:
      type: string
      enum: [my_today, overdue, pending, blockers, general]
    PmsAssistantAnswer:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [answered, empty, clarification, unavailable]
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/PmsAssistantCitation"
        claims:
          type: array
          items:
            $ref: "#/components/schemas/PmsAssistantClaim"
        intent:
          $ref: "#/components/schemas/PmsAssistantQueryIntent"
        personalizationKey:
          type: string
          pattern: "^[a-f0-9]{64}$"
      required: [status, answer, citations, claims]
    PmsAssistantCitation:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [client, project, task]
        id:
          type: string
        title:
          type: string
        excerpt:
          type: string
      required: [kind, id, title, excerpt]
    PmsAssistantClaim:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        basis:
          type: string
          enum: [recorded, inference]
        citationIds:
          type: array
          items:
            type: string
          minItems: 1
      required: [text, basis, citationIds]
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]

